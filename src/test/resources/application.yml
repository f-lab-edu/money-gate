server:
  port: 8080
  tomcat:
    threads:
      max: 200
    accept-count: 50

investing:
  url: "https://sbcharts.investing.com"
  connectTimeout: 3000
  readTimeout: 10000

springdoc:
  swagger-ui:
    path:"/swagger"

spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MYSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      connection-timeout: 30000
      idle-timeout: 60000
      max-lifetime: 58000
      data-source-properties:
        socketTimeout: 60

  sql:
    init:
      schema-locations:
        - classpath:sql/account/user.sql
        - classpath:sql/news_feed/news_feed.sql
        - classpath:sql/news_feed/news_feed_like.sql
        - classpath:sql/news_feed_comment.sql
      mode: always

